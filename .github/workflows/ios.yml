name: Build iPhone IPA
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'ios/**'
      - 'scripts/build-ipa.sh'
      - '.github/workflows/ios.yml'
      - 'server/**'
permissions:
  contents: read
jobs:
  verify-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test server/test.mjs
  build-ios:
    needs: verify-server
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build device app and package unsigned IPA
        run: bash scripts/build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Volna-unsigned-IPA
          path: dist/Volna-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
