name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - 'scripts/build-apk.sh'
      - '.github/workflows/android.yml'
      - 'server/**'
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify messenger server
        run: node --test server/test.mjs
      - name: Ensure Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          if [[ ! -f "$SDK/platforms/android-35/android.jar" || ! -x "$SDK/build-tools/35.0.0/aapt2" ]]; then
            MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
            test -x "$MANAGER"
            "$MANAGER" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Compile, sign and verify APK
        run: bash scripts/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Volna-Android-APK
          path: |
            dist/Volna.apk
            dist/Volna.apk.sha256
          if-no-files-found: error
          retention-days: 7
